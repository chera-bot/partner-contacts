<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner Contacts</title>
<style>
:root{--p:#2563eb;--ph:#1d4ed8;--pl:#dbeafe;--s:#059669;--d:#dc2626;
--g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;
--g500:#6b7280;--g600:#4b5563;--g700:#374151;--g800:#1f2937;--r:12px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--g50);color:var(--g800);min-height:100vh}
.hide{display:none!important}

/* Login */
#loginPage{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#1e3a5f,#2563eb)}
.lc{background:#fff;border-radius:20px;padding:48px 40px;width:400px;max-width:90vw;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,.2)}
.lc-icon{width:64px;height:64px;background:var(--pl);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
.lc-icon svg{width:28px;height:28px;stroke:var(--p);fill:none;stroke-width:2}
.lc h1{font-size:22px;margin-bottom:8px}.lc p{font-size:14px;color:var(--g500);margin-bottom:24px}
.lc input{width:100%;padding:14px 16px;border:2px solid var(--g200);border-radius:var(--rs);font-size:16px;outline:none;text-align:center;letter-spacing:4px;transition:border .2s}
.lc input:focus{border-color:var(--p)}
.btn-login{width:100%;padding:14px;background:var(--p);color:#fff;border:none;border-radius:var(--rs);font-size:16px;font-weight:600;cursor:pointer;margin-top:16px;transition:background .2s}
.btn-login:hover{background:var(--ph)}.btn-login:disabled{opacity:.5;cursor:not-allowed}
.login-err{color:var(--d);font-size:13px;margin-top:12px;min-height:20px}

/* Dashboard */
#dashboard{display:none;flex-direction:column;min-height:100vh}
#dashboard.on{display:flex}
.topbar{background:#fff;border-bottom:1px solid var(--g200);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar h1{font-size:18px;color:var(--g800)}
.topbar-btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 20px;border-radius:var(--rs);font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:var(--ph)}
.btn-o{background:#fff;color:var(--g600);border:1px solid var(--g300)}.btn-o:hover{background:var(--g50)}
.btn-d{background:var(--d);color:#fff}.btn-d:hover{background:#b91c1c}
.btn-s{padding:7px 14px;font-size:13px}
.main{padding:24px 32px;flex:1;max-width:1400px;width:100%;margin:0 auto}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.stat{background:#fff;border-radius:var(--r);padding:14px 18px;border:1px solid var(--g200);cursor:pointer;transition:all .15s;user-select:none}
.stat:hover{border-color:var(--p);box-shadow:0 2px 8px rgba(37,99,235,.08)}
.stat.on{border-color:var(--p);background:var(--pl)}
.stat-label{font-size:11px;color:var(--g500);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat-num{font-size:26px;font-weight:700;color:var(--g800);margin-top:2px}
.stat.on .stat-num{color:var(--p)}
.stat.total{border-left:3px solid var(--p)}.stat.total .stat-num{color:var(--p)}

/* Search */
.search{margin-bottom:18px;position:relative}
.search input{width:100%;padding:11px 16px 11px 42px;border:2px solid var(--g200);border-radius:var(--rs);font-size:14px;outline:none;background:#fff;transition:border .2s}
.search input:focus{border-color:var(--p)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--g400);fill:none;stroke-width:2}

/* Table */
.tbl-wrap{background:#fff;border-radius:var(--r);border:1px solid var(--g200);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{padding:12px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--g500);text-transform:uppercase;background:var(--g50);border-bottom:2px solid var(--g200);white-space:nowrap;letter-spacing:.3px}
tbody td{padding:12px 14px;font-size:14px;border-bottom:1px solid var(--g100);vertical-align:middle}
tbody tr:hover{background:#f8faff}
tbody tr.selected{background:#eff6ff}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600}
.b-IR{background:#dbeafe;color:#1d4ed8}.b-CorpDev{background:#fef3c7;color:#92400e}
.b-Invest{background:#d1fae5;color:#065f46}.b-Mobility{background:#ede9fe;color:#5b21b6}
.b-PG\/Payment{background:#fce7f3;color:#9d174d}.b-Insurance{background:#fed7aa;color:#9a3412}
.badge:not([class*="b-"]){background:var(--g100);color:var(--g600)}
.mono{font-family:"SF Mono",Consolas,monospace;font-size:13px;color:var(--g600)}
.empty{text-align:center;padding:50px 20px;color:var(--g400)}
.empty p{font-size:15px;margin-top:12px}
th.th-chk,td.td-chk{width:40px;text-align:center}
td.td-chk input,th.th-chk input{width:16px;height:16px;accent-color:var(--p);cursor:pointer}
.coupon-chk{width:16px;height:16px;accent-color:var(--s);cursor:pointer}
.btn-edit{padding:4px 10px;font-size:12px;border-radius:6px;border:1px solid var(--g300);background:#fff;color:var(--g600);cursor:pointer;transition:all .15s}
.btn-edit:hover{border-color:var(--p);color:var(--p);background:var(--pl)}
th.th-act,td.td-act{width:50px;text-align:center}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;justify-content:center;align-items:center;backdrop-filter:blur(3px)}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:16px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal-head{padding:22px 26px 0;display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:17px}
.modal-x{width:30px;height:30px;border-radius:8px;border:none;background:var(--g100);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--g500);transition:background .15s}
.modal-x:hover{background:var(--g200)}
.modal-body{padding:20px 26px 26px}
.fg{margin-bottom:14px}.fg label{display:block;font-size:12px;font-weight:600;color:var(--g600);margin-bottom:4px}
.fg .req{color:var(--d)}
.fg input,.fg select{width:100%;padding:9px 12px;border:1.5px solid var(--g200);border-radius:var(--rs);font-size:14px;outline:none;transition:border .15s}
.fg input:focus,.fg select:focus{border-color:var(--p)}
.row2{display:flex;gap:10px}.row2 .fg{flex:1}
.chk{display:flex;align-items:center;gap:7px;margin-top:7px}
.chk input[type=checkbox]{width:15px;height:15px;accent-color:var(--p)}
.chk label{font-size:12px;color:var(--p);cursor:pointer;margin:0;font-weight:500}
.newcat{margin-top:7px;display:none}.newcat.on{display:block}
.modal-btns{display:flex;gap:10px;margin-top:20px}.modal-btns .btn{flex:1;padding:11px;justify-content:center}

/* OCR */
.ocr-box{border:2px dashed var(--g300);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;margin-bottom:18px;transition:all .2s;background:var(--g50)}
.ocr-box:hover{border-color:var(--p);background:var(--pl)}
.ocr-box svg{width:32px;height:32px;stroke:var(--g400);fill:none;stroke-width:1.5;margin-bottom:8px}
.ocr-box:hover svg{stroke:var(--p)}
.ocr-box p{font-size:13px;color:var(--g500);margin-top:4px}
.ocr-box .ocr-title{font-size:14px;font-weight:600;color:var(--g700)}
.ocr-box:hover .ocr-title{color:var(--p)}
.ocr-preview{position:relative;margin-bottom:18px;display:none}
.ocr-preview.on{display:block}
.ocr-preview img{width:100%;border-radius:var(--rs);border:1px solid var(--g200)}
.ocr-preview .ocr-remove{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.ocr-progress{background:var(--g100);border-radius:var(--rs);padding:16px;margin-bottom:18px;display:none;text-align:center}
.ocr-progress.on{display:block}
.ocr-progress .ocr-bar{height:6px;background:var(--g200);border-radius:3px;margin-top:10px;overflow:hidden}
.ocr-progress .ocr-fill{height:100%;background:var(--p);border-radius:3px;transition:width .3s;width:0}
.ocr-progress p{font-size:13px;color:var(--g600);font-weight:500}

/* Batch OCR */
.batch-wrap{display:none;max-height:55vh;overflow-y:auto;margin-bottom:14px}
.batch-wrap.on{display:block}
.batch-card{border:1px solid var(--g200);border-radius:var(--rs);padding:14px;margin-bottom:10px;position:relative;background:#fff}
.batch-card:hover{border-color:var(--p)}
.batch-card .bc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.batch-card .bc-num{font-size:12px;font-weight:600;color:var(--p);background:var(--pl);padding:2px 8px;border-radius:6px}
.batch-card .bc-del{width:24px;height:24px;border:none;background:var(--g100);border-radius:6px;cursor:pointer;font-size:14px;color:var(--g500);display:flex;align-items:center;justify-content:center}
.batch-card .bc-del:hover{background:#fee2e2;color:var(--d)}
.batch-card .bc-row{display:flex;gap:8px;margin-bottom:6px}
.batch-card .bc-row input{flex:1;padding:6px 8px;border:1px solid var(--g200);border-radius:6px;font-size:13px;outline:none}
.batch-card .bc-row input:focus{border-color:var(--p)}
.batch-card .bc-row input::placeholder{color:var(--g400)}
.batch-cat{margin-bottom:14px}
.batch-cat label{font-size:12px;font-weight:600;color:var(--g600);margin-bottom:4px;display:block}
.batch-cat select{width:100%;padding:9px 12px;border:1.5px solid var(--g200);border-radius:var(--rs);font-size:14px;outline:none}
.batch-info{font-size:12px;color:var(--g500);margin-bottom:12px}

/* Toast & Loader */
.toast{position:fixed;bottom:20px;right:20px;padding:12px 22px;border-radius:var(--rs);font-size:14px;font-weight:500;z-index:200;transform:translateY(80px);opacity:0;transition:all .3s;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.toast.on{transform:translateY(0);opacity:1}.toast.ok{background:var(--s);color:#fff}.toast.er{background:var(--d);color:#fff}
.loader{display:none;position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:150;justify-content:center;align-items:center}
.loader.on{display:flex}
.spin{width:36px;height:36px;border:3px solid var(--g200);border-top-color:var(--p);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Delete bar */
.del-bar{display:none;align-items:center;gap:12px;padding:10px 16px;background:#fef2f2;border:1px solid #fecaca;border-radius:var(--rs);margin-bottom:14px}
.del-bar.on{display:flex}
.del-bar span{font-size:13px;color:var(--d);font-weight:500}

@media(max-width:768px){
.topbar{padding:12px 16px;flex-wrap:wrap;gap:10px}.topbar h1{font-size:16px;width:100%}
.main{padding:16px}.stats{grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:10px 12px}.stat-num{font-size:20px}
.tbl-wrap{overflow-x:auto}table{min-width:900px}.row2{flex-direction:column;gap:0}
}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
<div class="lc">
<div class="lc-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
<h1>Partner Contacts</h1>
<p>접속 암호를 입력하세요</p>
<input type="password" id="pw" placeholder="Password" autocomplete="off">
<button class="btn-login" id="lBtn" onclick="login()">접속</button>
<div class="login-err" id="lErr"></div>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
<div class="topbar">
<h1>Partner Contacts</h1>
<div class="topbar-btns">
<button class="btn btn-p" onclick="openModal()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>신규 연락처 등록</button>
<button class="btn btn-o btn-s" onclick="refresh()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>새로고침</button>
<button class="btn btn-o btn-s" onclick="logout()">로그아웃</button>
</div>
</div>
<div class="main">
<div class="stats" id="stats"></div>
<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
<input type="text" id="q" placeholder="이름, 기업, 연락처, 팀, 직책으로 검색..." oninput="render()"></div>
<div class="del-bar" id="delBar"><span id="delCount">0개 선택</span><button class="btn btn-d btn-s" onclick="deleteSelected()">선택 삭제</button><button class="btn btn-o btn-s" onclick="clearSel()">선택 해제</button></div>
<div class="tbl-wrap"><table><thead><tr>
<th class="th-chk"><input type="checkbox" id="chkAll" onchange="toggleAll()"></th>
<th>구분</th><th>기업</th><th>성함</th><th>직책</th><th>조직/팀</th><th>연락처(M)</th><th>연락처(E)</th><th>쿠폰</th><th>비고</th><th class="th-act"></th>
</tr></thead>
<tbody id="tbody"></tbody></table></div>
</div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="ov" onclick="if(event.target===this)closeModal()">
<div class="modal">
<div class="modal-head"><h2 id="modalTitle">신규 연락처 등록</h2><button class="modal-x" onclick="closeModal()">&times;</button></div>
<div class="modal-body">
<div class="ocr-box" id="ocrBox" onclick="document.getElementById('ocrFile').click()">
<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
<div class="ocr-title">명함 촬영 / 업로드</div>
<p>명함 사진을 찍거나 선택하면 자동으로 인식합니다</p>
</div>
<input type="file" id="ocrFile" accept="image/*" capture="environment" multiple style="display:none" onchange="handleOCR(this)">
<div class="ocr-preview" id="ocrPreview"><img id="ocrImg"><button class="ocr-remove" onclick="clearOCR()">&times;</button></div>
<div class="ocr-progress" id="ocrProg"><p id="ocrStatus">명함 인식 중...</p><div class="ocr-bar"><div class="ocr-fill" id="ocrFill"></div></div></div>
<div class="batch-wrap" id="batchWrap">
<div class="batch-info" id="batchInfo"></div>
<div class="batch-cat"><label>구분 (전체 적용) <span class="req">*</span></label><select id="bCat"></select></div>
<div id="batchList"></div>
<div class="modal-btns"><button class="btn btn-o" onclick="closeBatch()">취소</button><button class="btn btn-p" id="batchSubBtn" onclick="submitBatch()">전체 등록</button></div>
</div>
<div id="singleForm">
<div class="fg"><label>구분 <span class="req">*</span></label><select id="fCat"></select>
<div class="chk"><input type="checkbox" id="fNewChk" onchange="toggleNew()"><label for="fNewChk">새 구분 추가</label></div>
<div class="newcat" id="fNewWrap"><input type="text" id="fNewCat" placeholder="새 구분 이름 (예: Legal)"></div></div>
<div class="fg"><label>기업 <span class="req">*</span></label><input type="text" id="fCo" placeholder="기업명"></div>
<div class="row2"><div class="fg"><label>성함 <span class="req">*</span></label><input type="text" id="fNm" placeholder="이름"></div>
<div class="fg"><label>직책</label><input type="text" id="fTi" placeholder="직책"></div></div>
<div class="fg"><label>조직/팀</label><input type="text" id="fTm" placeholder="조직 또는 팀명"></div>
<div class="row2"><div class="fg"><label>연락처 (M)</label><input type="tel" id="fPh" placeholder="010-0000-0000"></div>
<div class="fg"><label>연락처 (E)</label><input type="email" id="fEm" placeholder="email@company.com"></div></div>
<div class="fg"><label>비고</label><input type="text" id="fNo" placeholder="메모"></div>
<div class="modal-btns"><button class="btn btn-o" onclick="closeModal()">취소</button><button class="btn btn-p" id="subBtn" onclick="submit()">등록</button></div>
</div><!-- /singleForm -->
</div></div></div>

<div class="loader" id="loader"><div class="spin"></div></div>
<div class="toast" id="toast"></div>

<script>
// Config
var REPO='chera-bot/partner-contacts';
var FILE='data/contacts.json';
var ENC={iv:'c05b5a6287d5a219a8c1d92f',tag:'6539b2e1786679a30e8e265f0239b6ea',enc:'a1b34df5ec2b5f4f797a1d8f95f104a99ddd5df3808dfbccb4c9bda6d477244991a29ebc5815d57d'};

// State
var db={categories:[],contacts:[]},ghToken='',curFilter='all',fileSha='';
var selected={},editId=null;

// === Crypto ===
function hex2buf(h){var b=new Uint8Array(h.length/2);for(var i=0;i<h.length;i+=2)b[i/2]=parseInt(h.substr(i,2),16);return b}
function buf2str(b){return new TextDecoder().decode(b)}
async function sha256(s){return await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))}
async function decrypt(pwd){
  var keyBuf=await sha256(pwd);
  var key=await crypto.subtle.importKey('raw',keyBuf,{name:'AES-GCM'},false,['decrypt']);
  var iv=hex2buf(ENC.iv),ct=hex2buf(ENC.enc+ENC.tag);
  try{return buf2str(await crypto.subtle.decrypt({name:'AES-GCM',iv:iv,tagLength:128},key,ct))}catch(e){return null}
}

// === Auth ===
var _pwd='';
async function login(){
  var pw=document.getElementById('pw').value,err=document.getElementById('lErr'),btn=document.getElementById('lBtn');
  if(!pw){err.textContent='암호를 입력하세요';return}
  btn.disabled=true;btn.textContent='확인 중...';err.textContent='';
  var t=await decrypt(pw);
  if(!t){err.textContent='암호가 올바르지 않습니다';btn.disabled=false;btn.textContent='접속';return}
  ghToken=t;_pwd=pw;sessionStorage.setItem('_k',pw);
  document.getElementById('loginPage').classList.add('hide');
  document.getElementById('dashboard').classList.add('on');
  btn.disabled=false;btn.textContent='접속';await loadData();
}
function logout(){ghToken='';sessionStorage.removeItem('_k');db={categories:[],contacts:[]};
  document.getElementById('dashboard').classList.remove('on');document.getElementById('loginPage').classList.remove('hide');document.getElementById('pw').value=''}
async function autoLogin(){var k=sessionStorage.getItem('_k');if(!k)return;var t=await decrypt(k);if(!t)return;
  ghToken=t;_pwd=k;document.getElementById('loginPage').classList.add('hide');document.getElementById('dashboard').classList.add('on');await loadData()}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')login()});

// === GitHub API ===
async function ghGet(path){
  var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{headers:{'Authorization':'Bearer '+ghToken,'Accept':'application/vnd.github.v3+json'}});
  return r.json();
}
async function ghPut(path,content,sha,msg){
  var body={message:msg,content:btoa(unescape(encodeURIComponent(content)))};
  if(sha)body.sha=sha;
  var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
    method:'PUT',headers:{'Authorization':'Bearer '+ghToken,'Content-Type':'application/json'},body:JSON.stringify(body)});
  return r.json();
}

// === Encryption ===
async function encryptData(plaintext){
  var keyBuf=await sha256(_pwd);
  var key=await crypto.subtle.importKey('raw',keyBuf,{name:'AES-GCM'},false,['encrypt']);
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var enc=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv,tagLength:128},key,new TextEncoder().encode(plaintext));
  var arr=new Uint8Array(enc);var ct=arr.slice(0,arr.length-16);var tag=arr.slice(arr.length-16);
  function toHex(b){return Array.from(b).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
  return JSON.stringify({iv:toHex(iv),tag:toHex(tag),data:toHex(ct)});
}
async function decryptData(encrypted){
  var obj=JSON.parse(encrypted);
  var keyBuf=await sha256(_pwd);
  var key=await crypto.subtle.importKey('raw',keyBuf,{name:'AES-GCM'},false,['decrypt']);
  return buf2str(await crypto.subtle.decrypt({name:'AES-GCM',iv:hex2buf(obj.iv),tagLength:128},key,hex2buf(obj.data+obj.tag)));
}

// === Data ===
async function loadData(){
  loading(true);
  try{var res=await ghGet(FILE);fileSha=res.sha;
    db=JSON.parse(await decryptData(decodeURIComponent(escape(atob(res.content.replace(/\n/g,''))))));
  }catch(e){toast('데이터 로드 실패','er')}
  selected={};updateDelBar();renderStats();render();loading(false);
}
async function saveData(msg){
  var encrypted=await encryptData(JSON.stringify(db,null,2));
  var res=await ghPut(FILE,encrypted,fileSha,msg||'Update contacts');
  if(res.content)fileSha=res.content.sha;return res;
}
async function refresh(){await loadData();toast('새로고침 완료','ok')}

// === Render ===
function renderStats(){
  var el=document.getElementById('stats'),cnt={},total=db.contacts.length;
  db.categories.forEach(function(c){cnt[c]=0});
  db.contacts.forEach(function(c){cnt[c.category]=(cnt[c.category]||0)+1});
  var h='<div class="stat total'+(curFilter==='all'?' on':'')+'" onclick="setF(\'all\')"><div class="stat-label">전체</div><div class="stat-num">'+total+'</div></div>';
  db.categories.forEach(function(c){
    h+='<div class="stat'+(curFilter===c?' on':'')+'" onclick="setF(\''+esc(c)+'\')"><div class="stat-label">'+esc(c)+'</div><div class="stat-num">'+(cnt[c]||0)+'</div></div>';
  });el.innerHTML=h;
}
function render(){
  var tb=document.getElementById('tbody'),q=(document.getElementById('q').value||'').toLowerCase(),list=db.contacts;
  if(curFilter!=='all')list=list.filter(function(c){return c.category===curFilter});
  if(q)list=list.filter(function(c){return[c.company,c.name,c.phone,c.email,c.team,c.title,c.note].some(function(v){return(v||'').toLowerCase().indexOf(q)>=0})});
  if(!list.length){tb.innerHTML='<tr><td colspan="11"><div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><p>'+(q?'검색 결과가 없습니다':'등록된 연락처가 없습니다')+'</p></div></td></tr>';return}
  tb.innerHTML=list.map(function(c){
    var sel=selected[c.id]?' selected':'';
    var chk=selected[c.id]?' checked':'';
    var cpn=c.coupon?' checked':'';
    return '<tr class="'+sel+'"><td class="td-chk"><input type="checkbox"'+chk+' onchange="toggleSel(\''+c.id+'\')"></td>'
      +'<td><span class="badge b-'+c.category.replace('/','\\/')+'">'+esc(c.category)+'</span></td>'
      +'<td><b>'+esc(c.company)+'</b></td><td>'+esc(c.name)+'</td><td>'+esc(c.title)+'</td><td>'+esc(c.team)+'</td>'
      +'<td class="mono">'+(c.phone?'<a href="tel:'+c.phone.replace(/[^0-9+]/g,'')+'" style="color:var(--g600);text-decoration:none">'+esc(c.phone)+'</a>':'')+' </td><td class="mono">'+(c.email?'<a href="mailto:'+esc(c.email)+'" style="color:var(--g600);text-decoration:none">'+esc(c.email)+'</a>':'')+'</td>'
      +'<td style="text-align:center"><input type="checkbox" class="coupon-chk"'+cpn+' onchange="toggleCoupon(\''+c.id+'\')"></td>'
      +'<td>'+esc(c.note)+'</td>'
      +'<td class="td-act"><button class="btn-edit" onclick="editContact(\''+c.id+'\')">수정</button></td></tr>';
  }).join('');
  document.getElementById('chkAll').checked=false;
}
function setF(f){curFilter=f;renderStats();render()}

// === Selection ===
function toggleSel(id){if(selected[id])delete selected[id];else selected[id]=true;updateDelBar();render()}
function toggleAll(){
  var all=document.getElementById('chkAll').checked;
  var q=(document.getElementById('q').value||'').toLowerCase(),list=db.contacts;
  if(curFilter!=='all')list=list.filter(function(c){return c.category===curFilter});
  if(q)list=list.filter(function(c){return[c.company,c.name,c.phone,c.email,c.team,c.title,c.note].some(function(v){return(v||'').toLowerCase().indexOf(q)>=0})});
  selected={};if(all)list.forEach(function(c){selected[c.id]=true});
  updateDelBar();render();document.getElementById('chkAll').checked=all;
}
function clearSel(){selected={};updateDelBar();render()}
function updateDelBar(){
  var n=Object.keys(selected).length;
  document.getElementById('delBar').classList.toggle('on',n>0);
  document.getElementById('delCount').textContent=n+'개 선택';
}
async function deleteSelected(){
  var ids=Object.keys(selected);if(!ids.length)return;
  if(!confirm(ids.length+'개 연락처를 삭제하시겠습니까?'))return;
  loading(true);
  db.contacts=db.contacts.filter(function(c){return!selected[c.id]});
  selected={};
  try{await saveData('Delete '+ids.length+' contacts');toast(ids.length+'개 삭제 완료','ok')}
  catch(e){toast('삭제 실패','er')}
  updateDelBar();renderStats();render();loading(false);
}

// === Coupon ===
async function toggleCoupon(id){
  var c=db.contacts.find(function(x){return x.id===id});if(!c)return;
  c.coupon=!c.coupon;render();
  try{await saveData((c.coupon?'Coupon given: ':'Coupon removed: ')+c.name)}catch(e){toast('저장 실패','er')}
}

// === Modal (Add & Edit) ===
function openModal(id){
  editId=id||null;
  var isEdit=!!editId;
  document.getElementById('modalTitle').textContent=isEdit?'연락처 수정':'신규 연락처 등록';
  document.getElementById('subBtn').textContent=isEdit?'저장':'등록';
  var sel=document.getElementById('fCat');
  sel.innerHTML=db.categories.map(function(c){return'<option value="'+esc(c)+'">'+esc(c)+'</option>'}).join('');
  sel.disabled=false;document.getElementById('fNewChk').checked=false;document.getElementById('fNewWrap').classList.remove('on');
  if(isEdit){
    var c=db.contacts.find(function(x){return x.id===id});
    if(c){sel.value=c.category;document.getElementById('fCo').value=c.company||'';document.getElementById('fNm').value=c.name||'';
      document.getElementById('fTi').value=c.title||'';document.getElementById('fTm').value=c.team||'';
      document.getElementById('fPh').value=c.phone||'';document.getElementById('fEm').value=c.email||'';document.getElementById('fNo').value=c.note||'';}
  }else{
    ['fCo','fNm','fTi','fTm','fPh','fEm','fNo','fNewCat'].forEach(function(x){document.getElementById(x).value=''});
  }
  document.getElementById('subBtn').disabled=false;clearOCR();
  batchItems=[];document.getElementById('batchWrap').classList.remove('on');document.getElementById('singleForm').style.display='';
  document.getElementById('ov').classList.add('on');
}
function editContact(id){openModal(id)}
function closeModal(){document.getElementById('ov').classList.remove('on');editId=null}
function toggleNew(){var on=document.getElementById('fNewChk').checked;document.getElementById('fNewWrap').classList.toggle('on',on);document.getElementById('fCat').disabled=on}

async function submit(){
  var isNew=document.getElementById('fNewChk').checked;
  var co=document.getElementById('fCo').value.trim(),nm=document.getElementById('fNm').value.trim();
  if(!co||!nm){toast('기업명과 성함은 필수입니다','er');return}
  var cat=isNew?document.getElementById('fNewCat').value.trim():document.getElementById('fCat').value;
  if(isNew&&!cat){toast('새 구분 이름을 입력하세요','er');return}
  var btn=document.getElementById('subBtn');btn.disabled=true;btn.textContent=editId?'저장 중...':'등록 중...';
  if(isNew&&db.categories.indexOf(cat)<0)db.categories.push(cat);

  var fields={category:cat,company:co,name:nm,title:document.getElementById('fTi').value.trim(),
    team:document.getElementById('fTm').value.trim(),phone:document.getElementById('fPh').value.trim(),
    email:document.getElementById('fEm').value.trim(),note:document.getElementById('fNo').value.trim()};

  if(editId){
    // Edit
    var c=db.contacts.find(function(x){return x.id===editId});
    if(c){Object.assign(c,fields)}
    try{var res=await saveData('Edit: '+nm);
      if(res.content){toast(nm+' 수정 완료','ok');closeModal();renderStats();render()}
      else{toast('저장 실패','er');btn.disabled=false;btn.textContent='저장'}
    }catch(e){toast('오류가 발생했습니다','er');btn.disabled=false;btn.textContent='저장'}
  }else{
    // Add
    var c=Object.assign({id:'c'+Date.now(),coupon:false},fields);
    db.contacts.push(c);
    try{var res=await saveData('Add: '+nm+' ('+cat+')');
      if(res.content){toast(cat+'에 '+nm+' 등록 완료','ok');closeModal();renderStats();render()}
      else{db.contacts.pop();toast('저장 실패','er');btn.disabled=false;btn.textContent='등록'}
    }catch(e){db.contacts.pop();toast('오류가 발생했습니다','er');btn.disabled=false;btn.textContent='등록'}
  }
}

// === Utils ===
function loading(on){document.getElementById('loader').classList.toggle('on',on)}
function toast(m,t){var el=document.getElementById('toast');el.textContent=m;el.className='toast '+t+' on';setTimeout(function(){el.classList.remove('on')},3000)}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML}

// === OCR ===
var batchItems=[];
function handleOCR(input){
  if(!input.files||!input.files.length)return;
  if(input.files.length>1){handleBatchOCR(input.files);return}
  var reader=new FileReader();
  reader.onload=function(e){document.getElementById('ocrImg').src=e.target.result;
    document.getElementById('ocrPreview').classList.add('on');document.getElementById('ocrBox').style.display='none';runOCR(e.target.result);};
  reader.readAsDataURL(input.files[0]);
}
async function handleBatchOCR(files){
  document.getElementById('ocrBox').style.display='none';
  document.getElementById('singleForm').style.display='none';
  var prog=document.getElementById('ocrProg'),fill=document.getElementById('ocrFill'),status=document.getElementById('ocrStatus');
  prog.classList.add('on');
  if(!window.Tesseract){fill.style.width='5%';status.textContent='OCR 엔진 로딩 중...';
    await new Promise(function(ok){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;document.head.appendChild(s)})}
  batchItems=[];
  for(var i=0;i<files.length;i++){
    var pct=Math.round((i/files.length)*100);
    fill.style.width=pct+'%';status.textContent=(i+1)+'/'+files.length+' 인식 중...';
    var src=await readFile(files[i]);
    var processed=await preprocessImage(src);
    try{var r=await Tesseract.recognize(processed,'kor+eng');batchItems.push(parseCard(r.data.text))}
    catch(e){batchItems.push({company:'',name:'',title:'',team:'',phone:'',email:''})}
  }
  fill.style.width='100%';status.textContent=files.length+'장 인식 완료!';
  setTimeout(function(){prog.classList.remove('on');showBatch()},800);
}
function readFile(f){return new Promise(function(ok){var r=new FileReader();r.onload=function(e){ok(e.target.result)};r.readAsDataURL(f)})}
function showBatch(){
  var wrap=document.getElementById('batchWrap');wrap.classList.add('on');
  document.getElementById('batchInfo').textContent=batchItems.length+'개 명함 인식 결과 - 내용을 확인/수정 후 등록하세요';
  var sel=document.getElementById('bCat');
  sel.innerHTML=db.categories.map(function(c){return'<option value="'+esc(c)+'">'+esc(c)+'</option>'}).join('');
  renderBatch();
}
function renderBatch(){
  var list=document.getElementById('batchList');
  list.innerHTML=batchItems.map(function(c,i){
    return '<div class="batch-card"><div class="bc-head"><span class="bc-num">#'+(i+1)+'</span><button class="bc-del" onclick="removeBatch('+i+')">&times;</button></div>'
      +'<div class="bc-row"><input placeholder="기업" value="'+esc(c.company)+'" onchange="batchItems['+i+'].company=this.value"><input placeholder="성함" value="'+esc(c.name)+'" onchange="batchItems['+i+'].name=this.value"></div>'
      +'<div class="bc-row"><input placeholder="직책" value="'+esc(c.title)+'" onchange="batchItems['+i+'].title=this.value"><input placeholder="조직/팀" value="'+esc(c.team)+'" onchange="batchItems['+i+'].team=this.value"></div>'
      +'<div class="bc-row"><input placeholder="연락처(M)" value="'+esc(c.phone)+'" onchange="batchItems['+i+'].phone=this.value"><input placeholder="이메일" value="'+esc(c.email)+'" onchange="batchItems['+i+'].email=this.value"></div></div>';
  }).join('');
}
function removeBatch(i){batchItems.splice(i,1);if(!batchItems.length){closeBatch();return}
  document.getElementById('batchInfo').textContent=batchItems.length+'개 명함';renderBatch()}
function closeBatch(){batchItems=[];document.getElementById('batchWrap').classList.remove('on');
  document.getElementById('singleForm').style.display='';document.getElementById('ocrBox').style.display='';closeModal()}
async function submitBatch(){
  var cat=document.getElementById('bCat').value;
  var valid=batchItems.filter(function(c){return c.company&&c.name});
  if(!valid.length){toast('기업명과 성함이 입력된 항목이 없습니다','er');return}
  var btn=document.getElementById('batchSubBtn');btn.disabled=true;btn.textContent='등록 중...';
  valid.forEach(function(c){db.contacts.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,6),category:cat,company:c.company,name:c.name,
    title:c.title||'',team:c.team||'',phone:c.phone||'',email:c.email||'',note:'',coupon:false})});
  try{var res=await saveData('Batch add '+valid.length+' contacts');
    if(res.content){toast(valid.length+'개 연락처 등록 완료','ok');batchItems=[];
      document.getElementById('batchWrap').classList.remove('on');document.getElementById('singleForm').style.display='';
      document.getElementById('ocrBox').style.display='';closeModal();renderStats();render()}
    else{for(var i=0;i<valid.length;i++)db.contacts.pop();toast('저장 실패','er');btn.disabled=false;btn.textContent='전체 등록'}
  }catch(e){for(var i=0;i<valid.length;i++)db.contacts.pop();toast('오류 발생','er');btn.disabled=false;btn.textContent='전체 등록'}
}
function clearOCR(){document.getElementById('ocrPreview').classList.remove('on');document.getElementById('ocrProg').classList.remove('on');
  document.getElementById('ocrBox').style.display='';document.getElementById('ocrFile').value=''}
function preprocessImage(imgSrc){
  return new Promise(function(resolve){
    var img=new Image();img.crossOrigin='anonymous';
    img.onload=function(){
      var cv=document.createElement('canvas');var ctx=cv.getContext('2d');
      // Scale up small images for better OCR
      var scale=Math.max(1,2000/Math.max(img.width,img.height));
      cv.width=img.width*scale;cv.height=img.height*scale;
      ctx.drawImage(img,0,0,cv.width,cv.height);
      // Grayscale + contrast boost
      var id=ctx.getImageData(0,0,cv.width,cv.height);var d=id.data;
      for(var i=0;i<d.length;i+=4){
        var gray=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        // Increase contrast
        gray=((gray-128)*1.5)+128;
        gray=Math.max(0,Math.min(255,gray));
        // Light threshold to clean noise
        if(gray>200)gray=255;if(gray<60)gray=0;
        d[i]=d[i+1]=d[i+2]=gray;
      }
      ctx.putImageData(id,0,0);
      resolve(cv.toDataURL('image/png'));
    };img.src=imgSrc;
  });
}
async function runOCR(imgSrc){
  var prog=document.getElementById('ocrProg'),fill=document.getElementById('ocrFill'),status=document.getElementById('ocrStatus');
  prog.classList.add('on');fill.style.width='5%';status.textContent='이미지 전처리 중...';
  var processed=await preprocessImage(imgSrc);
  fill.style.width='15%';status.textContent='OCR 엔진 로딩 중...';
  if(!window.Tesseract){await new Promise(function(ok){var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;document.head.appendChild(s)})}
  fill.style.width='30%';status.textContent='명함 인식 중...';
  try{var result=await Tesseract.recognize(processed,'kor+eng',{logger:function(m){
    if(m.status==='recognizing text')fill.style.width=Math.round(30+m.progress*65)+'%'}});
    fill.style.width='100%';status.textContent='인식 완료!';fillForm(parseCard(result.data.text));
    setTimeout(function(){prog.classList.remove('on')},1200);
  }catch(e){status.textContent='인식 실패';setTimeout(function(){prog.classList.remove('on')},2000)}
}
function parseCard(text){
  var r={company:'',name:'',title:'',team:'',phone:'',email:''},lines=text.split(/\n/).map(function(l){return l.trim()}).filter(function(l){return l});
  var emailRe=/[\w.+-]+@[\w.-]+\.\w{2,}/,phoneRe=/0\d{1,2}[-.\s)]{0,2}\d{3,4}[-.\s]{0,2}\d{4}/;
  var corpRe=/(주식회사|㈜|\(주\)|Co\.|Corp|Ltd|Inc|그룹|금융|은행|증권|보험|캐피탈|페이|생명)/i;
  var titleRe=/(대표|사장|부사장|전무|상무|이사|부장|차장|과장|대리|사원|주임|매니저|팀장|파트장|부부장|센터장|실장|본부장|수석|책임|선임|Principal|Director|Manager|VP|CEO|CTO|CFO|COO|Head|Lead|Senior|Associate|Partner)/i;
  var teamRe=/(팀|부문|본부|부서|실|센터|국|과|Division|Department|Team|Group|Unit)/;
  for(var i=0;i<lines.length;i++){var m;if(!r.email&&(m=lines[i].match(emailRe)))r.email=m[0];
    if(!r.phone&&(m=lines[i].match(phoneRe)))r.phone=m[0].replace(/[.\s)(]/g,function(c){return c==='.'||c===' '?'-':''});
    if(!r.company&&corpRe.test(lines[i]))r.company=lines[i].replace(/[\|｜]/g,'').trim();
    if(!r.title&&(m=lines[i].match(titleRe)))r.title=lines[i].trim();
    if(!r.team&&teamRe.test(lines[i])&&lines[i]!==r.title&&lines[i]!==r.company)r.team=lines[i].replace(/[\|｜]/g,'').trim()}
  var used=[r.company,r.title,r.team,r.phone,r.email].join(' ');
  var skip=/(주식|회사|금융|서비스|보험|증권|은행|그룹|센터|경영|전략|기업|투자|운영|사업|개발|영업|지원|마케팅|미래)/;
  for(var i=0;i<lines.length&&!r.name;i++){if(lines[i]===r.company||lines[i]===r.team||emailRe.test(lines[i])||phoneRe.test(lines[i]))continue;
    var ns=lines[i].match(/[가-힣]{2,4}/g);if(ns)for(var j=0;j<ns.length;j++){if(ns[j].length>=2&&ns[j].length<=4&&used.indexOf(ns[j])<0&&!skip.test(ns[j])){r.name=ns[j];break}}}
  if(r.title&&r.name&&r.title.indexOf(r.name)>=0)r.title=r.title.replace(r.name,'').trim();
  if(r.title){var m=r.title.match(titleRe);if(m&&r.title.length>m[0].length+5)r.title=m[0]}
  return r;
}
function fillForm(p){['Co','Nm','Ti','Tm','Ph','Em'].forEach(function(k,i){
  var keys=['company','name','title','team','phone','email'];
  if(p[keys[i]])document.getElementById('f'+k).value=p[keys[i]]});
  toast('명함 인식 완료 - 내용을 확인해주세요','ok')}
