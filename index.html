<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner Contacts</title>
<style>
:root{--p:#2563eb;--ph:#1d4ed8;--pl:#dbeafe;--s:#059669;--sl:#d1fae5;--d:#dc2626;
--g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;
--g500:#6b7280;--g600:#4b5563;--g700:#374151;--g800:#1f2937;--r:12px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--g50);color:var(--g800);min-height:100vh}
.hide{display:none!important}
#loginPage{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#1e3a5f,#2563eb)}
.lc{background:#fff;border-radius:20px;padding:48px 40px;width:400px;max-width:90vw;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,.2)}
.lc-icon{width:64px;height:64px;background:var(--pl);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
.lc-icon svg{width:28px;height:28px;stroke:var(--p);fill:none;stroke-width:2}
.lc h1{font-size:22px;margin-bottom:8px}.lc p{font-size:14px;color:var(--g500);margin-bottom:24px}
.lc input{width:100%;padding:14px 16px;border:2px solid var(--g200);border-radius:var(--rs);font-size:16px;outline:none;text-align:center;letter-spacing:4px}
.lc input:focus{border-color:var(--p)}
.btn-login{width:100%;padding:14px;background:var(--p);color:#fff;border:none;border-radius:var(--rs);font-size:16px;font-weight:600;cursor:pointer;margin-top:16px}
.btn-login:hover{background:var(--ph)}.btn-login:disabled{opacity:.5;cursor:not-allowed}
.login-err{color:var(--d);font-size:13px;margin-top:12px;min-height:20px}
#dashboard{display:none;flex-direction:column;min-height:100vh}#dashboard.on{display:flex}
.topbar{background:#fff;border-bottom:1px solid var(--g200);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar h1{font-size:18px}.topbar-btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 20px;border-radius:var(--rs);font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:var(--ph)}
.btn-o{background:#fff;color:var(--g600);border:1px solid var(--g300)}.btn-o:hover{background:var(--g50)}
.btn-d{background:var(--d);color:#fff}.btn-d:hover{background:#b91c1c}
.btn-s{padding:7px 14px;font-size:13px}
.main{padding:24px 32px;flex:1;max-width:1400px;width:100%;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.stat{background:#fff;border-radius:var(--r);padding:14px 18px;border:1px solid var(--g200);cursor:pointer;transition:all .15s;user-select:none}
.stat:hover{border-color:var(--p)}.stat.on{border-color:var(--p);background:var(--pl)}
.stat-label{font-size:11px;color:var(--g500);font-weight:600;text-transform:uppercase}.stat-num{font-size:26px;font-weight:700;margin-top:2px}
.stat.on .stat-num{color:var(--p)}.stat.total{border-left:3px solid var(--p)}.stat.total .stat-num,.stat-num{color:var(--g800)}.stat.total .stat-num{color:var(--p)}
.search{margin-bottom:18px;position:relative}
.search input{width:100%;padding:11px 16px 11px 42px;border:2px solid var(--g200);border-radius:var(--rs);font-size:14px;outline:none;background:#fff}
.search input:focus{border-color:var(--p)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--g400);fill:none;stroke-width:2}
.tbl-wrap{background:#fff;border-radius:var(--r);border:1px solid var(--g200);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{padding:12px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--g500);text-transform:uppercase;background:var(--g50);border-bottom:2px solid var(--g200);white-space:nowrap}
tbody td{padding:12px 14px;font-size:14px;border-bottom:1px solid var(--g100);vertical-align:middle}
tbody tr:hover{background:#f8faff}tbody tr.selected{background:#eff6ff}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600}
.b-IR{background:#dbeafe;color:#1d4ed8}.b-CorpDev{background:#fef3c7;color:#92400e}.b-Invest{background:#d1fae5;color:#065f46}
.b-Mobility{background:#ede9fe;color:#5b21b6}.b-PGPayment{background:#fce7f3;color:#9d174d}.b-Insurance{background:#fed7aa;color:#9a3412}
.badge:not([class*="b-"]){background:var(--g100);color:var(--g600)}
.mono{font-family:"SF Mono",Consolas,monospace;font-size:13px;color:var(--g600)}
.empty{text-align:center;padding:50px 20px;color:var(--g400)}.empty p{font-size:15px;margin-top:12px}
th.th-chk,td.td-chk{width:40px;text-align:center}
td.td-chk input,th.th-chk input{width:16px;height:16px;accent-color:var(--p);cursor:pointer}
.btn-edit{padding:4px 10px;font-size:12px;border-radius:6px;border:1px solid var(--g300);background:#fff;color:var(--g600);cursor:pointer}
.btn-edit:hover{border-color:var(--p);color:var(--p);background:var(--pl)}
.td-meet,.td-cpn{cursor:pointer;white-space:nowrap}
.td-meet:hover,.td-cpn:hover{color:var(--p)}
.td-meet span,.td-cpn span{font-size:13px}
.cpn-badge{background:var(--sl);color:var(--s);padding:2px 8px;border-radius:8px;font-size:12px;font-weight:600}
.meet-date{color:var(--g600);font-size:13px}

/* Overlays & Modals */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;justify-content:center;align-items:center;backdrop-filter:blur(3px)}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:16px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal-head{padding:22px 26px 0;display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:17px}
.modal-x{width:30px;height:30px;border-radius:8px;border:none;background:var(--g100);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--g500)}.modal-x:hover{background:var(--g200)}
.modal-body{padding:20px 26px 26px}
.fg{margin-bottom:14px}.fg label{display:block;font-size:12px;font-weight:600;color:var(--g600);margin-bottom:4px}.fg .req{color:var(--d)}
.fg input,.fg select{width:100%;padding:9px 12px;border:1.5px solid var(--g200);border-radius:var(--rs);font-size:14px;outline:none}
.fg input:focus,.fg select:focus{border-color:var(--p)}
.row2{display:flex;gap:10px}.row2 .fg{flex:1}
.chk{display:flex;align-items:center;gap:7px;margin-top:7px}.chk input[type=checkbox]{width:15px;height:15px;accent-color:var(--p)}
.chk label{font-size:12px;color:var(--p);cursor:pointer;margin:0;font-weight:500}
.newcat{margin-top:7px;display:none}.newcat.on{display:block}
.modal-btns{display:flex;gap:10px;margin-top:20px}.modal-btns .btn{flex:1;padding:11px;justify-content:center}

/* OCR */
.ocr-box{border:2px dashed var(--g300);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;margin-bottom:18px;transition:all .2s;background:var(--g50)}
.ocr-box:hover{border-color:var(--p);background:var(--pl)}
.ocr-box svg{width:32px;height:32px;stroke:var(--g400);fill:none;stroke-width:1.5;margin-bottom:8px}.ocr-box:hover svg{stroke:var(--p)}
.ocr-box p{font-size:13px;color:var(--g500);margin-top:4px}.ocr-box .ocr-title{font-size:14px;font-weight:600;color:var(--g700)}.ocr-box:hover .ocr-title{color:var(--p)}
.ocr-preview{position:relative;margin-bottom:18px;display:none}.ocr-preview.on{display:block}
.ocr-preview img{width:100%;border-radius:var(--rs);border:1px solid var(--g200)}
.ocr-preview .ocr-remove{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.ocr-progress{background:var(--g100);border-radius:var(--rs);padding:16px;margin-bottom:18px;display:none;text-align:center}.ocr-progress.on{display:block}
.ocr-progress .ocr-bar{height:6px;background:var(--g200);border-radius:3px;margin-top:10px;overflow:hidden}
.ocr-progress .ocr-fill{height:100%;background:var(--p);border-radius:3px;transition:width .3s;width:0}
.ocr-progress p{font-size:13px;color:var(--g600);font-weight:500}
.batch-wrap{display:none;max-height:55vh;overflow-y:auto;margin-bottom:14px}.batch-wrap.on{display:block}
.batch-card{border:1px solid var(--g200);border-radius:var(--rs);padding:14px;margin-bottom:10px;position:relative;background:#fff}.batch-card:hover{border-color:var(--p)}
.batch-card .bc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.batch-card .bc-num{font-size:12px;font-weight:600;color:var(--p);background:var(--pl);padding:2px 8px;border-radius:6px}
.batch-card .bc-del{width:24px;height:24px;border:none;background:var(--g100);border-radius:6px;cursor:pointer;font-size:14px;color:var(--g500);display:flex;align-items:center;justify-content:center}.batch-card .bc-del:hover{background:#fee2e2;color:var(--d)}
.batch-card .bc-row{display:flex;gap:8px;margin-bottom:6px}
.batch-card .bc-row input{flex:1;padding:6px 8px;border:1px solid var(--g200);border-radius:6px;font-size:13px;outline:none}.batch-card .bc-row input:focus{border-color:var(--p)}
.batch-cat{margin-bottom:14px}.batch-cat label{font-size:12px;font-weight:600;color:var(--g600);margin-bottom:4px;display:block}
.batch-cat select{width:100%;padding:9px 12px;border:1.5px solid var(--g200);border-radius:var(--rs);font-size:14px;outline:none}
.batch-info{font-size:12px;color:var(--g500);margin-bottom:12px}

/* Detail Panel */
.detail{width:560px}
.det-info{display:flex;align-items:center;gap:14px;padding:20px 26px;border-bottom:1px solid var(--g200)}
.det-avatar{width:48px;height:48px;border-radius:50%;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--p)}
.det-meta h3{font-size:16px;margin-bottom:2px}.det-meta p{font-size:13px;color:var(--g500)}
.det-tabs{display:flex;border-bottom:2px solid var(--g200);padding:0 26px}
.det-tab{padding:12px 20px;font-size:14px;font-weight:500;color:var(--g500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.det-tab.on{color:var(--p);border-bottom-color:var(--p)}
.det-tab:hover{color:var(--p)}
.det-panel{padding:20px 26px 26px;max-height:50vh;overflow-y:auto}
.det-panel.hide{display:none}
.det-empty{text-align:center;padding:30px;color:var(--g400);font-size:14px}
.det-item{padding:12px;border:1px solid var(--g200);border-radius:var(--rs);margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start}
.det-item-main{flex:1}
.det-item-date{font-size:12px;color:var(--g500);margin-bottom:3px}
.det-item-type{font-size:14px;font-weight:500}
.det-item-memo{font-size:13px;color:var(--g500);margin-top:2px}
.det-item-del{width:24px;height:24px;border:none;background:none;cursor:pointer;color:var(--g400);font-size:14px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.det-item-del:hover{background:#fee2e2;color:var(--d)}
.det-add{border:1px solid var(--g200);border-radius:var(--rs);padding:16px;margin-top:12px;background:var(--g50)}
.det-add-title{font-size:13px;font-weight:600;color:var(--g600);margin-bottom:10px}
.det-add-row{margin-bottom:10px}
.det-add-row label{font-size:12px;color:var(--g500);margin-bottom:4px;display:block}
.det-add-row input{padding:8px 10px;border:1px solid var(--g200);border-radius:6px;font-size:14px;outline:none;width:100%}
.det-add-row input:focus{border-color:var(--p)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.preset{padding:6px 14px;border-radius:20px;font-size:13px;border:1.5px solid var(--g200);background:#fff;cursor:pointer;transition:all .15s;color:var(--g600);font-weight:500}
.preset:hover{border-color:var(--p);color:var(--p)}
.preset.on{background:var(--p);color:#fff;border-color:var(--p)}
.stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--g200);border-radius:8px;overflow:hidden}
.stepper button{width:36px;height:36px;border:none;background:var(--g50);cursor:pointer;font-size:18px;color:var(--g600);display:flex;align-items:center;justify-content:center}
.stepper button:hover{background:var(--g200)}
.stepper span{width:40px;text-align:center;font-size:15px;font-weight:600}
.other-input{margin-top:6px;display:none}.other-input.on{display:block}

/* Toast & Loader & Delete bar */
.toast{position:fixed;bottom:20px;right:20px;padding:12px 22px;border-radius:var(--rs);font-size:14px;font-weight:500;z-index:200;transform:translateY(80px);opacity:0;transition:all .3s;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.toast.on{transform:translateY(0);opacity:1}.toast.ok{background:var(--s);color:#fff}.toast.er{background:var(--d);color:#fff}
.loader{display:none;position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:150;justify-content:center;align-items:center}.loader.on{display:flex}
.spin{width:36px;height:36px;border:3px solid var(--g200);border-top-color:var(--p);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.del-bar{display:none;align-items:center;gap:12px;padding:10px 16px;background:#fef2f2;border:1px solid #fecaca;border-radius:var(--rs);margin-bottom:14px}.del-bar.on{display:flex}
.del-bar span{font-size:13px;color:var(--d);font-weight:500}
@media(max-width:768px){.topbar{padding:12px 16px;flex-wrap:wrap;gap:10px}.topbar h1{font-size:16px;width:100%}.main{padding:16px}
.stats{grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:10px 12px}.stat-num{font-size:20px}.tbl-wrap{overflow-x:auto}table{min-width:900px}.row2{flex-direction:column;gap:0}.detail{width:95vw}}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="loginPage"><div class="lc">
<div class="lc-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
<h1>Partner Contacts</h1><p>접속 암호를 입력하세요</p>
<input type="password" id="pw" placeholder="Password" autocomplete="off">
<button class="btn-login" id="lBtn" onclick="login()">접속</button>
<div class="login-err" id="lErr"></div></div></div>

<div id="dashboard">
<div class="topbar"><h1>Partner Contacts</h1>
<div class="topbar-btns">
<button class="btn btn-p" onclick="openModal()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>신규 연락처 등록</button>
<button class="btn btn-o btn-s" onclick="refresh()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>새로고침</button>
<button class="btn btn-o btn-s" onclick="logout()">로그아웃</button></div></div>
<div class="main">
<div class="stats" id="stats"></div>
<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
<input type="text" id="q" placeholder="이름, 기업, 연락처, 팀, 직책으로 검색..." oninput="render()"></div>
<div id="filterBar" style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
<select id="fltCompany" onchange="render()" style="padding:7px 12px;border:1.5px solid var(--g200);border-radius:var(--rs);font-size:13px;outline:none;background:#fff;min-width:140px"><option value="">기업: 전체</option></select>
<select id="fltCoupon" onchange="render()" style="padding:7px 12px;border:1.5px solid var(--g200);border-radius:var(--rs);font-size:13px;outline:none;background:#fff"><option value="">쿠폰: 전체</option><option value="Y">지급함</option><option value="N">미지급</option></select>
<button class="btn btn-o btn-s" onclick="clearFilters()">필터 초기화</button>
</div>
<div class="del-bar" id="delBar"><span id="delCount">0개 선택</span><button class="btn btn-d btn-s" onclick="deleteSelected()">선택 삭제</button><button class="btn btn-o btn-s" onclick="clearSel()">선택 해제</button></div>
<div class="tbl-wrap"><table><thead><tr>
<th class="th-chk"><input type="checkbox" id="chkAll" onchange="toggleAll()"></th>
<th>구분</th><th>기업</th><th>성함</th><th>직책</th><th>조직/팀</th><th>연락처(M)</th><th>연락처(E)</th><th>최근미팅</th><th>쿠폰</th><th></th>
</tr></thead><tbody id="tbody"></tbody></table></div></div></div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="ov" onclick="if(event.target===this)closeModal()"><div class="modal">
<div class="modal-head"><h2 id="modalTitle">신규 연락처 등록</h2><button class="modal-x" onclick="closeModal()">&times;</button></div>
<div class="modal-body">
<div class="ocr-box" id="ocrBox" onclick="document.getElementById('ocrFile').click()">
<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
<div class="ocr-title">명함 촬영 / 업로드</div><p>명함 사진을 찍거나 선택하면 자동으로 인식합니다</p></div>
<input type="file" id="ocrFile" accept="image/*" capture="environment" multiple style="display:none" onchange="handleOCR(this)">
<div class="ocr-preview" id="ocrPreview"><img id="ocrImg"><button class="ocr-remove" onclick="clearOCR()">&times;</button></div>
<div class="ocr-progress" id="ocrProg"><p id="ocrStatus">명함 인식 중...</p><div class="ocr-bar"><div class="ocr-fill" id="ocrFill"></div></div></div>
<div class="batch-wrap" id="batchWrap"><div class="batch-info" id="batchInfo"></div>
<div class="batch-cat"><label>구분 (전체 적용) <span class="req">*</span></label><select id="bCat"></select></div>
<div id="batchList"></div>
<div class="modal-btns"><button class="btn btn-o" onclick="closeBatch()">취소</button><button class="btn btn-p" id="batchSubBtn" onclick="submitBatch()">전체 등록</button></div></div>
<div id="singleForm">
<div class="fg"><label>구분 <span class="req">*</span></label><select id="fCat"></select>
<div class="chk"><input type="checkbox" id="fNewChk" onchange="toggleNew()"><label for="fNewChk">새 구분 추가</label></div>
<div class="newcat" id="fNewWrap"><input type="text" id="fNewCat" placeholder="새 구분 이름 (예: Legal)"></div></div>
<div class="fg"><label>기업 <span class="req">*</span></label><input type="text" id="fCo" placeholder="기업명" oninput="liveDupCheck()"></div>
<div class="row2"><div class="fg"><label>성함 <span class="req">*</span></label><input type="text" id="fNm" placeholder="이름" oninput="liveDupCheck()"></div>
<div class="fg"><label>직책</label><input type="text" id="fTi" placeholder="직책"></div></div>
<div class="fg"><label>조직/팀</label><input type="text" id="fTm" placeholder="조직 또는 팀명"></div>
<div id="dupWarn" style="display:none;padding:10px 14px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;margin-bottom:14px;font-size:13px;color:var(--d)"></div>
<div class="row2"><div class="fg"><label>연락처 (M)</label><input type="tel" id="fPh" placeholder="010-0000-0000" oninput="liveDupCheck()"></div>
<div class="fg"><label>연락처 (E)</label><input type="email" id="fEm" placeholder="email@company.com"></div></div>
<div class="fg"><label>비고</label><input type="text" id="fNo" placeholder="메모"></div>
<div id="manualQueue" style="display:none;margin-bottom:14px">
<div style="font-size:12px;font-weight:600;color:var(--g600);margin-bottom:6px" id="mqLabel">대기 중 0명</div>
<div id="mqList" style="max-height:120px;overflow-y:auto"></div></div>
<div class="modal-btns" style="flex-wrap:wrap">

<script>
var REPO='chera-bot/partner-contacts',FILE='data/contacts.json';
var ENC={iv:'c05b5a6287d5a219a8c1d92f',tag:'6539b2e1786679a30e8e265f0239b6ea',enc:'a1b34df5ec2b5f4f797a1d8f95f104a99ddd5df3808dfbccb4c9bda6d477244991a29ebc5815d57d'};
var db={categories:[],contacts:[]},ghToken='',curFilter='all',fileSha='',selected={},editId=null,_pwd='',detContactId=null;
var MEET_TYPES=['첫 인사','정기미팅','IR','식사','전화통화','기타'];
var selMeet='',cpnQty=1;

// === Crypto ===
function hex2buf(h){var b=new Uint8Array(h.length/2);for(var i=0;i<h.length;i+=2)b[i/2]=parseInt(h.substr(i,2),16);return b}
function buf2str(b){return new TextDecoder().decode(b)}
async function sha256(s){return await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))}
async function decrypt(pwd){var k=await sha256(pwd);var key=await crypto.subtle.importKey('raw',k,{name:'AES-GCM'},false,['decrypt']);
  try{return buf2str(await crypto.subtle.decrypt({name:'AES-GCM',iv:hex2buf(ENC.iv),tagLength:128},key,hex2buf(ENC.enc+ENC.tag)))}catch(e){return null}}
async function encryptData(pt){var k=await sha256(_pwd);var key=await crypto.subtle.importKey('raw',k,{name:'AES-GCM'},false,['encrypt']);
  var iv=crypto.getRandomValues(new Uint8Array(12));var enc=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv,tagLength:128},key,new TextEncoder().encode(pt));
  var a=new Uint8Array(enc);var ct=a.slice(0,a.length-16);var tag=a.slice(a.length-16);
  function h(b){return Array.from(b).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
  return JSON.stringify({iv:h(iv),tag:h(tag),data:h(ct)})}
async function decryptData(e){var o=JSON.parse(e);var k=await sha256(_pwd);var key=await crypto.subtle.importKey('raw',k,{name:'AES-GCM'},false,['decrypt']);
  return buf2str(await crypto.subtle.decrypt({name:'AES-GCM',iv:hex2buf(o.iv),tagLength:128},key,hex2buf(o.data+o.tag)))}

// === Auth ===
async function login(){var pw=document.getElementById('pw').value,err=document.getElementById('lErr'),btn=document.getElementById('lBtn');
  if(!pw){err.textContent='암호를 입력하세요';return}btn.disabled=true;btn.textContent='확인 중...';err.textContent='';
  var t=await decrypt(pw);if(!t){err.textContent='암호가 올바르지 않습니다';btn.disabled=false;btn.textContent='접속';return}
  ghToken=t;_pwd=pw;sessionStorage.setItem('_k',pw);document.getElementById('loginPage').classList.add('hide');
  document.getElementById('dashboard').classList.add('on');btn.disabled=false;btn.textContent='접속';await loadData()}
function logout(){ghToken='';sessionStorage.removeItem('_k');db={categories:[],contacts:[]};
  document.getElementById('dashboard').classList.remove('on');document.getElementById('loginPage').classList.remove('hide');document.getElementById('pw').value=''}
async function autoLogin(){var k=sessionStorage.getItem('_k');if(!k)return;var t=await decrypt(k);if(!t)return;
  ghToken=t;_pwd=k;document.getElementById('loginPage').classList.add('hide');document.getElementById('dashboard').classList.add('on');await loadData()}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')login()});

// === GitHub API ===
async function ghGet(p){return(await fetch('https://api.github.com/repos/'+REPO+'/contents/'+p,{headers:{'Authorization':'Bearer '+ghToken,'Accept':'application/vnd.github.v3+json'}})).json()}
async function ghPut(p,c,sha,m){var b={message:m,content:btoa(unescape(encodeURIComponent(c)))};if(sha)b.sha=sha;
  return(await fetch('https://api.github.com/repos/'+REPO+'/contents/'+p,{method:'PUT',headers:{'Authorization':'Bearer '+ghToken,'Content-Type':'application/json'},body:JSON.stringify(b)})).json()}

// === Data ===
async function loadData(){loading(true);try{var r=await ghGet(FILE);fileSha=r.sha;
  db=JSON.parse(await decryptData(decodeURIComponent(escape(atob(r.content.replace(/\n/g,''))))));
  db.contacts.forEach(function(c){if(!c.meetings)c.meetings=[];if(!c.coupons)c.coupons=[]});
  }catch(e){toast('데이터 로드 실패','er')}selected={};updateDelBar();renderStats();updateFilterOptions();render();loading(false)}
async function saveData(m){var enc=await encryptData(JSON.stringify(db,null,2));var r=await ghPut(FILE,enc,fileSha,m||'Update');if(r.content)fileSha=r.content.sha;return r}
async function refresh(){await loadData();toast('새로고침 완료','ok')}

// === Render ===
function renderStats(){var el=document.getElementById('stats'),cn={},t=db.contacts.length;
  db.categories.forEach(function(c){cn[c]=0});db.contacts.forEach(function(c){cn[c.category]=(cn[c.category]||0)+1});
  var h='<div class="stat total'+(curFilter==='all'?' on':'')+'" onclick="setF(\'all\')"><div class="stat-label">전체</div><div class="stat-num">'+t+'</div></div>';
  db.categories.forEach(function(c){h+='<div class="stat'+(curFilter===c?' on':'')+'" onclick="setF(\''+esc(c)+'\')"><div class="stat-label">'+esc(c)+'</div><div class="stat-num">'+(cn[c]||0)+'</div></div>'});
  el.innerHTML=h}
function updateFilterOptions(){
  var list=curFilter==='all'?db.contacts:db.contacts.filter(function(c){return c.category===curFilter});
  var companies={};list.forEach(function(c){if(c.company)companies[c.company]=true});
  var sel=document.getElementById('fltCompany');var cur=sel.value;
  sel.innerHTML='<option value="">기업: 전체</option>'+Object.keys(companies).sort().map(function(c){return'<option value="'+esc(c)+'">'+esc(c)+'</option>'}).join('');
  if(companies[cur])sel.value=cur;else sel.value=''}
function clearFilters(){document.getElementById('fltCompany').value='';document.getElementById('fltCoupon').value='';render()}
function render(){var tb=document.getElementById('tbody'),q=(document.getElementById('q').value||'').toLowerCase(),list=db.contacts;
  var fCo=document.getElementById('fltCompany').value,fCpn=document.getElementById('fltCoupon').value;
  if(curFilter!=='all')list=list.filter(function(c){return c.category===curFilter});
  if(fCo)list=list.filter(function(c){return c.company===fCo});
  if(fCpn==='Y')list=list.filter(function(c){return c.coupons&&c.coupons.length>0});
  if(fCpn==='N')list=list.filter(function(c){return!c.coupons||!c.coupons.length});
  if(q)list=list.filter(function(c){return[c.company,c.name,c.phone,c.email,c.team,c.title].some(function(v){return(v||'').toLowerCase().indexOf(q)>=0})});
  if(!list.length){tb.innerHTML='<tr><td colspan="11"><div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><p>'+(q?'검색 결과가 없습니다':'등록된 연락처가 없습니다')+'</p></div></td></tr>';return}
  tb.innerHTML=list.map(function(c){
    var sel=selected[c.id]?' selected':'',chk=selected[c.id]?' checked':'';
    var lastMeet=c.meetings&&c.meetings.length?c.meetings.sort(function(a,b){return b.date.localeCompare(a.date)})[0]:null;
    var cpnCnt=c.coupons?c.coupons.reduce(function(s,x){return s+(x.qty||1)},0):0;
    return '<tr class="'+sel+'"><td class="td-chk"><input type="checkbox"'+chk+' onchange="toggleSel(\''+c.id+'\')"></td>'
      +'<td><span class="badge b-'+c.category.replace(/\//g,'')+'">'+esc(c.category)+'</span></td>'
      +'<td><b>'+esc(c.company)+'</b></td><td>'+esc(c.name)+'</td><td>'+esc(c.title)+'</td><td>'+esc(c.team)+'</td>'
      +'<td class="mono">'+(c.phone?'<a href="tel:'+c.phone.replace(/[^0-9+]/g,'')+'" style="color:var(--g600);text-decoration:none">'+esc(c.phone)+'</a>':'')+'</td>'
      +'<td class="mono">'+(c.email?'<a href="mailto:'+esc(c.email)+'" style="color:var(--g600);text-decoration:none">'+esc(c.email)+'</a>':'')+'</td>'
      +'<td class="td-meet" onclick="openDet(\''+c.id+'\',0)">'+(lastMeet?'<span class="meet-date">'+lastMeet.date.slice(5)+'</span>':'<span style="color:var(--g400)">-</span>')+'</td>'
      +'<td class="td-cpn" onclick="openDet(\''+c.id+'\',1)">'+(cpnCnt?'<span class="cpn-badge">'+cpnCnt+'회</span>':'<span style="color:var(--g400)">-</span>')+'</td>'
      +'<td><button class="btn-edit" onclick="editContact(\''+c.id+'\')">수정</button></td></tr>'}).join('');
  document.getElementById('chkAll').checked=false}
function setF(f){curFilter=f;renderStats();updateFilterOptions();render()}

// === Selection & Delete ===
function toggleSel(id){if(selected[id])delete selected[id];else selected[id]=true;updateDelBar();render()}
function toggleAll(){var all=document.getElementById('chkAll').checked;var q=(document.getElementById('q').value||'').toLowerCase(),list=db.contacts;
  if(curFilter!=='all')list=list.filter(function(c){return c.category===curFilter});
  if(q)list=list.filter(function(c){return[c.company,c.name,c.phone,c.email,c.team,c.title].some(function(v){return(v||'').toLowerCase().indexOf(q)>=0})});
  selected={};if(all)list.forEach(function(c){selected[c.id]=true});updateDelBar();render();document.getElementById('chkAll').checked=all}
function clearSel(){selected={};updateDelBar();render()}
function updateDelBar(){var n=Object.keys(selected).length;document.getElementById('delBar').classList.toggle('on',n>0);document.getElementById('delCount').textContent=n+'개 선택'}
async function deleteSelected(){var ids=Object.keys(selected);if(!ids.length||!confirm(ids.length+'개 연락처를 삭제하시겠습니까?'))return;
  loading(true);db.contacts=db.contacts.filter(function(c){return!selected[c.id]});selected={};
  try{await saveData('Delete '+ids.length);toast(ids.length+'개 삭제 완료','ok')}catch(e){toast('삭제 실패','er')}
  updateDelBar();renderStats();render();loading(false)}

// === Add/Edit Modal ===
var manualQ=[];
function openModal(id){editId=id||null;manualQ=[];var isE=!!editId;
  document.getElementById('modalTitle').textContent=isE?'연락처 수정':'신규 연락처 등록';
  document.getElementById('subBtn').textContent=isE?'저장':'등록';
  document.getElementById('addMoreBtn').style.display=isE?'none':'';
  var sel=document.getElementById('fCat');sel.innerHTML=db.categories.map(function(c){return'<option value="'+esc(c)+'">'+esc(c)+'</option>'}).join('');
  sel.disabled=false;document.getElementById('fNewChk').checked=false;document.getElementById('fNewWrap').classList.remove('on');
  if(isE){var c=db.contacts.find(function(x){return x.id===id});if(c){sel.value=c.category;document.getElementById('fCo').value=c.company||'';document.getElementById('fNm').value=c.name||'';
    document.getElementById('fTi').value=c.title||'';document.getElementById('fTm').value=c.team||'';document.getElementById('fPh').value=c.phone||'';document.getElementById('fEm').value=c.email||'';document.getElementById('fNo').value=c.note||''}}
  else{['fCo','fNm','fTi','fTm','fPh','fEm','fNo','fNewCat'].forEach(function(x){document.getElementById(x).value=''});
    if(curFilter!=='all')sel.value=curFilter}
  document.getElementById('subBtn').disabled=false;clearOCR();batchItems=[];document.getElementById('batchWrap').classList.remove('on');document.getElementById('singleForm').style.display='';
  renderManualQ();document.getElementById('ov').classList.add('on')}
function editContact(id){openModal(id)}
function closeModal(){document.getElementById('ov').classList.remove('on');editId=null;manualQ=[]}
function toggleNew(){var on=document.getElementById('fNewChk').checked;document.getElementById('fNewWrap').classList.toggle('on',on);document.getElementById('fCat').disabled=on}
function getFormData(){var isNew=document.getElementById('fNewChk').checked;
  var cat=isNew?document.getElementById('fNewCat').value.trim():document.getElementById('fCat').value;
  return{category:cat,company:document.getElementById('fCo').value.trim(),name:document.getElementById('fNm').value.trim(),
    title:document.getElementById('fTi').value.trim(),team:document.getElementById('fTm').value.trim(),
    phone:document.getElementById('fPh').value.trim(),email:document.getElementById('fEm').value.trim(),note:document.getElementById('fNo').value.trim(),isNewCat:isNew}}
function checkDup(d){return db.contacts.find(function(c){return c.company===d.company&&c.name===d.name&&d.phone&&c.phone===d.phone})}
function liveDupCheck(){
  var co=document.getElementById('fCo').value.trim(),nm=document.getElementById('fNm').value.trim(),ph=document.getElementById('fPh').value.trim();
  var warn=document.getElementById('dupWarn');
  if(!co||!nm){warn.style.display='none';return}
  var matches=db.contacts.filter(function(c){
    if(editId&&c.id===editId)return false;
    var coMatch=c.company===co,nmMatch=c.name===nm,phMatch=ph&&c.phone===ph;
    return(coMatch&&nmMatch)||(nmMatch&&phMatch)||(coMatch&&phMatch)});
  if(!matches.length){warn.style.display='none';return}
  var exact=matches.find(function(c){return c.company===co&&c.name===nm&&ph&&c.phone===ph});
  if(exact){warn.innerHTML='<b>중복 주의!</b> '+esc(co)+' '+esc(nm)+' / '+fmtPhone(ph)+(exact.email?' / '+esc(exact.email):'')+' 이미 등록되어 있습니다.';warn.style.display='block';return}
  warn.innerHTML='<b>유사 연락처 발견:</b><br>'+matches.map(function(c){return esc(c.company)+' '+esc(c.name)+(c.phone?' / '+fmtPhone(c.phone):'')+(c.email?' / '+esc(c.email):'')}).join('<br>');
  warn.style.display='block'}
function addToQueue(){var d=getFormData();if(!d.company||!d.name){toast('기업명과 성함은 필수입니다','er');return}
  if(d.isNewCat&&!d.category){toast('새 구분 이름을 입력하세요','er');return}
  var dup=checkDup(d);if(dup&&!confirm(d.company+' '+d.name+' ('+d.phone+') 이미 등록된 연락처입니다.\n그래도 추가하시겠습니까?'))return;
  manualQ.push(d);renderManualQ();
  ['fCo','fNm','fTi','fTm','fPh','fEm','fNo'].forEach(function(x){document.getElementById(x).value=''});
  toast(d.name+' 추가됨 ('+manualQ.length+'명 대기 중)','ok')}
function removeFromQ(i){manualQ.splice(i,1);renderManualQ()}
function renderManualQ(){var wrap=document.getElementById('manualQueue');var list=document.getElementById('mqList');
  if(!manualQ.length){wrap.style.display='none';document.getElementById('subBtn').textContent=editId?'저장':'등록';return}
  wrap.style.display='block';document.getElementById('mqLabel').textContent='대기 중 '+manualQ.length+'명';
  document.getElementById('subBtn').textContent='전체 등록 ('+(manualQ.length)+'+1)';
  list.innerHTML=manualQ.map(function(c,i){return'<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--g50);border-radius:6px;margin-bottom:4px;font-size:13px">'
    +'<span><b>'+esc(c.name)+'</b> · '+esc(c.company)+' · <span class="badge b-'+c.category.replace(/\//g,'')+'">'+esc(c.category)+'</span></span>'
    +'<button onclick="removeFromQ('+i+')" style="border:none;background:none;cursor:pointer;color:var(--g400);font-size:14px">&times;</button></div>'}).join('')}
async function submit(){var d=getFormData();var isNew=d.isNewCat;
  // If editing
  if(editId){if(!d.company||!d.name){toast('기업명과 성함은 필수입니다','er');return}
    var btn=document.getElementById('subBtn');btn.disabled=true;btn.textContent='저장 중...';
    if(isNew&&d.category&&db.categories.indexOf(d.category)<0)db.categories.push(d.category);
    var c=db.contacts.find(function(x){return x.id===editId});if(c)Object.assign(c,{category:d.category,company:d.company,name:d.name,title:d.title,team:d.team,phone:d.phone,email:d.email,note:d.note});
    try{var r=await saveData('Edit: '+d.name);if(r.content){toast(d.name+' 수정 완료','ok');closeModal();renderStats();render()}
    else{toast('저장 실패','er');btn.disabled=false;btn.textContent='저장'}}catch(e){toast('오류','er');btn.disabled=false;btn.textContent='저장'}
    return}
  // Collect all: queue + current form (if filled)
  var all=manualQ.slice();
  if(d.company&&d.name){var dup=checkDup(d);if(dup&&!confirm(d.company+' '+d.name+' ('+d.phone+') 이미 등록된 연락처입니다.\n그래도 추가하시겠습니까?'))return;all.push(d)}
  if(!all.length){toast('기업명과 성함은 필수입니다','er');return}
  var btn=document.getElementById('subBtn');btn.disabled=true;btn.textContent='등록 중...';
  all.forEach(function(item){
    if(item.isNewCat&&item.category&&db.categories.indexOf(item.category)<0)db.categories.push(item.category);
    db.contacts.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,6),category:item.category,company:item.company,name:item.name,
      title:item.title||'',team:item.team||'',phone:item.phone||'',email:item.email||'',note:item.note||'',meetings:[],coupons:[]})});
  try{var r=await saveData('Add '+all.length+' contacts');if(r.content){toast(all.length+'명 등록 완료','ok');closeModal();renderStats();render()}
  else{for(var i=0;i<all.length;i++)db.contacts.pop();toast('저장 실패','er');btn.disabled=false;btn.textContent='등록'}}
  catch(e){for(var i=0;i<all.length;i++)db.contacts.pop();toast('오류','er');btn.disabled=false;btn.textContent='등록'}}

// === Detail Panel ===
function openDet(id,tab){detContactId=id;var c=db.contacts.find(function(x){return x.id===id});if(!c)return;
  document.getElementById('detAvatar').textContent=c.name.charAt(0);
  document.getElementById('detName').textContent=c.name+' · '+c.company;
  document.getElementById('detSub').textContent=[c.title,c.team].filter(Boolean).join(' · ');
  selMeet='';cpnQty=1;
  document.getElementById('mDate').value=today();document.getElementById('cDate').value=today();
  document.getElementById('mMemo').value='';document.getElementById('cQty').textContent='1';
  document.getElementById('mOther').classList.remove('on');
  detTab(tab||0);renderMeet();renderCpn();renderMeetPresets();
  document.getElementById('detOv').classList.add('on')}
function closeDet(){document.getElementById('detOv').classList.remove('on');detContactId=null}
function detTab(n){var tabs=document.querySelectorAll('.det-tab');tabs.forEach(function(t,i){t.classList.toggle('on',i===n)});
  document.getElementById('detMeet').classList.toggle('hide',n!==0);document.getElementById('detCpn').classList.toggle('hide',n!==1)}
function today(){return new Date().toISOString().slice(0,10)}

// Meeting
function renderMeetPresets(){document.getElementById('mPresets').innerHTML=MEET_TYPES.map(function(t){
  return'<button class="preset'+(selMeet===t?' on':'')+'" onclick="pickMeet(\''+t+'\')">'+t+'</button>'}).join('')}
function pickMeet(t){selMeet=t;renderMeetPresets();document.getElementById('mOther').classList.toggle('on',t==='기타')}
var editMeetIdx=-1;
function renderMeet(){var c=db.contacts.find(function(x){return x.id===detContactId});if(!c)return;
  var el=document.getElementById('meetList');if(!c.meetings||!c.meetings.length){el.innerHTML='<div class="det-empty">미팅 이력이 없습니다</div>';return}
  var sorted=c.meetings.slice().sort(function(a,b){return b.date.localeCompare(a.date)});
  el.innerHTML=sorted.map(function(m,i){
    if(editMeetIdx===i)return'<div class="det-item" style="flex-direction:column;gap:8px">'
      +'<div style="display:flex;gap:8px;width:100%"><input type="date" id="emDate" value="'+m.date+'" style="flex:1;padding:6px 8px;border:1px solid var(--g200);border-radius:6px;font-size:13px">'
      +'<input type="text" id="emType" value="'+esc(m.type)+'" placeholder="유형" style="flex:1;padding:6px 8px;border:1px solid var(--g200);border-radius:6px;font-size:13px"></div>'
      +'<input type="text" id="emMemo" value="'+esc(m.memo||'')+'" placeholder="메모 (선택)" style="width:100%;padding:6px 8px;border:1px solid var(--g200);border-radius:6px;font-size:13px">'
      +'<div style="display:flex;gap:6px"><button class="btn btn-p btn-s" onclick="saveMeetEdit('+i+')">저장</button><button class="btn btn-o btn-s" onclick="editMeetIdx=-1;renderMeet()">취소</button></div></div>';
    return'<div class="det-item"><div class="det-item-main" onclick="editMeetIdx='+i+';renderMeet()" style="cursor:pointer"><div class="det-item-date">'+m.date+'</div>'
    +'<div class="det-item-type">'+esc(m.type)+'</div>'+(m.memo?'<div class="det-item-memo">'+esc(m.memo)+'</div>':'')
    +'</div><button class="det-item-del" onclick="event.stopPropagation();delMeet('+i+')">&times;</button></div>'}).join('')}
async function saveMeetEdit(i){var c=db.contacts.find(function(x){return x.id===detContactId});if(!c)return;
  var sorted=c.meetings.slice().sort(function(a,b){return b.date.localeCompare(a.date)});var m=sorted[i];
  m.date=document.getElementById('emDate').value;m.type=document.getElementById('emType').value.trim();m.memo=document.getElementById('emMemo').value.trim();
  editMeetIdx=-1;renderMeet();render();try{await saveData('Edit meeting: '+c.name)}catch(e){toast('저장 실패','er')}}
async function addMeet(){var c=db.contacts.find(function(x){return x.id===detContactId});if(!c)return;
  var type=selMeet==='기타'?document.getElementById('mOtherVal').value.trim():selMeet;
  if(!type){toast('유형을 선택하세요','er');return}
  c.meetings.push({date:document.getElementById('mDate').value,type:type,memo:document.getElementById('mMemo').value.trim()});
  renderMeet();render();selMeet='';renderMeetPresets();document.getElementById('mMemo').value='';document.getElementById('mOther').classList.remove('on');
  try{await saveData('Meeting: '+c.name)}catch(e){toast('저장 실패','er')}}
async function delMeet(i){var c=db.contacts.find(function(x){return x.id===detContactId});if(!c)return;
  var sorted=c.meetings.slice().sort(function(a,b){return b.date.localeCompare(a.date)});
  var target=sorted[i];c.meetings=c.meetings.filter(function(m){return m!==target});
  renderMeet();render();try{await saveData('Del meeting: '+c.name)}catch(e){toast('저장 실패','er')}}

async function addCpn(){var c=db.contacts.find(function(x){return x.id===detContactId});if(!c)return;

async function delCpn(i){var c=db.contacts.find(function(x){return x.id===detContactId});if(!c)return;
  var sorted=c.coupons.slice().sort(function(a,b){return b.date.localeCompare(a.date)});
  var target=sorted[i];c.coupons=c.coupons.filter(function(cp){return cp!==target});
  renderCpn();render();try{await saveData('Del coupon: '+c.name)}catch(e){toast('저장 실패','er')}}

// === Utils ===
function loading(on){document.getElementById('loader').classList.toggle('on',on)}
function toast(m,t){var el=document.getElementById('toast');el.textContent=m;el.className='toast '+t+' on';setTimeout(function(){el.classList.remove('on')},3000)}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmtPhone(p){if(!p)return'';var n=p.replace(/[^0-9]/g,'');if(n.length===11)return n.slice(0,3)+'-'+n.slice(3,7)+'-'+n.slice(7);if(n.length===10)return n.slice(0,3)+'-'+n.slice(3,6)+'-'+n.slice(6);return p}

// === OCR ===
var batchItems=[];
function handleOCR(input){if(!input.files||!input.files.length)return;
  if(input.files.length>1){handleBatchOCR(input.files);return}
  var reader=new FileReader();reader.onload=function(e){document.getElementById('ocrImg').src=e.target.result;
    document.getElementById('ocrPreview').classList.add('on');document.getElementById('ocrBox').style.display='none';runOCR(e.target.result)};
  reader.readAsDataURL(input.files[0])}
function clearOCR(){document.getElementById('ocrPreview').classList.remove('on');document.getElementById('ocrProg').classList.remove('on');
  document.getElementById('ocrBox').style.display='';document.getElementById('ocrFile').value=''}
function preprocessImage(src){return new Promise(function(ok){var img=new Image();img.crossOrigin='anonymous';img.onload=function(){
  var cv=document.createElement('canvas');var ctx=cv.getContext('2d');var sc=Math.max(1,2000/Math.max(img.width,img.height));
  cv.width=img.width*sc;cv.height=img.height*sc;ctx.drawImage(img,0,0,cv.width,cv.height);
  var id=ctx.getImageData(0,0,cv.width,cv.height);var d=id.data;
  for(var i=0;i<d.length;i+=4){var g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];g=((g-128)*1.5)+128;g=Math.max(0,Math.min(255,g));if(g>200)g=255;if(g<60)g=0;d[i]=d[i+1]=d[i+2]=g}
  ctx.putImageData(id,0,0);ok(cv.toDataURL('image/png'))};img.src=src})}
async function runOCR(src){var prog=document.getElementById('ocrProg'),fill=document.getElementById('ocrFill'),st=document.getElementById('ocrStatus');
  prog.classList.add('on');fill.style.width='5%';st.textContent='이미지 전처리 중...';var p=await preprocessImage(src);
  fill.style.width='15%';st.textContent='OCR 엔진 로딩 중...';
  if(!window.Tesseract){await new Promise(function(ok){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;document.head.appendChild(s)})}
  fill.style.width='30%';st.textContent='명함 인식 중...';
  try{var r=await Tesseract.recognize(p,'kor+eng',{logger:function(m){if(m.status==='recognizing text')fill.style.width=Math.round(30+m.progress*65)+'%'}});
    fill.style.width='100%';st.textContent='인식 완료!';fillForm(parseCard(r.data.text));setTimeout(function(){prog.classList.remove('on')},1200)}
  catch(e){st.textContent='인식 실패';setTimeout(function(){prog.classList.remove('on')},2000)}}
async function handleBatchOCR(files){document.getElementById('ocrBox').style.display='none';document.getElementById('singleForm').style.display='none';
  var prog=document.getElementById('ocrProg'),fill=document.getElementById('ocrFill'),st=document.getElementById('ocrStatus');prog.classList.add('on');
  if(!window.Tesseract){fill.style.width='5%';st.textContent='OCR 엔진 로딩 중...';
    await new Promise(function(ok){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;document.head.appendChild(s)})}
  batchItems=[];for(var i=0;i<files.length;i++){fill.style.width=Math.round((i/files.length)*100)+'%';st.textContent=(i+1)+'/'+files.length+' 인식 중...';
    var src=await readFile(files[i]);var p=await preprocessImage(src);
    try{var r=await Tesseract.recognize(p,'kor+eng');batchItems.push(parseCard(r.data.text))}catch(e){batchItems.push({company:'',name:'',title:'',team:'',phone:'',email:''})}}
  fill.style.width='100%';st.textContent=files.length+'장 인식 완료!';setTimeout(function(){prog.classList.remove('on');showBatch()},800)}
function readFile(f){return new Promise(function(ok){var r=new FileReader();r.onload=function(e){ok(e.target.result)};r.readAsDataURL(f)})}
function showBatch(){document.getElementById('batchWrap').classList.add('on');document.getElementById('batchInfo').textContent=batchItems.length+'개 명함 인식 결과';
  document.getElementById('bCat').innerHTML=db.categories.map(function(c){return'<option value="'+esc(c)+'">'+esc(c)+'</option>'}).join('');renderBatch()}
function renderBatch(){document.getElementById('batchList').innerHTML=batchItems.map(function(c,i){
  return'<div class="batch-card"><div class="bc-head"><span class="bc-num">#'+(i+1)+'</span><button class="bc-del" onclick="removeBatch('+i+')">&times;</button></div>'
    +'<div class="bc-row"><input placeholder="기업" value="'+esc(c.company)+'" onchange="batchItems['+i+'].company=this.value"><input placeholder="성함" value="'+esc(c.name)+'" onchange="batchItems['+i+'].name=this.value"></div>'
    +'<div class="bc-row"><input placeholder="직책" value="'+esc(c.title)+'" onchange="batchItems['+i+'].title=this.value"><input placeholder="조직/팀" value="'+esc(c.team)+'" onchange="batchItems['+i+'].team=this.value"></div>'
    +'<div class="bc-row"><input placeholder="연락처(M)" value="'+esc(c.phone)+'" onchange="batchItems['+i+'].phone=this.value"><input placeholder="이메일" value="'+esc(c.email)+'" onchange="batchItems['+i+'].email=this.value"></div></div>'}).join('')}
function removeBatch(i){batchItems.splice(i,1);if(!batchItems.length){closeBatch();return}document.getElementById('batchInfo').textContent=batchItems.length+'개 명함';renderBatch()}
function closeBatch(){batchItems=[];document.getElementById('batchWrap').classList.remove('on');document.getElementById('singleForm').style.display='';document.getElementById('ocrBox').style.display='';closeModal()}
async function submitBatch(){var cat=document.getElementById('bCat').value;
  var valid=batchItems.filter(function(c){return c.company&&c.name});if(!valid.length){toast('기업명과 성함이 입력된 항목이 없습니다','er');return}
  var btn=document.getElementById('batchSubBtn');btn.disabled=true;btn.textContent='등록 중...';
  valid.forEach(function(c){db.contacts.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,6),category:cat,company:c.company,name:c.name,
    title:c.title||'',team:c.team||'',phone:c.phone||'',email:c.email||'',note:'',meetings:[],coupons:[]})});
  try{var r=await saveData('Batch add '+valid.length);if(r.content){toast(valid.length+'개 등록 완료','ok');closeBatch();renderStats();render()}
  else{for(var i=0;i<valid.length;i++)db.contacts.pop();toast('저장 실패','er');btn.disabled=false;btn.textContent='전체 등록'}}
  catch(e){for(var i=0;i<valid.length;i++)db.contacts.pop();toast('오류','er');btn.disabled=false;btn.textContent='전체 등록'}}
function parseCard(text){var r={company:'',name:'',title:'',team:'',phone:'',email:''},lines=text.split(/\n/).map(function(l){return l.trim()}).filter(function(l){return l});
  var emailRe=/[\w.+-]+@[\w.-]+\.\w{2,}/,phoneRe=/0\d{1,2}[-.\s)]{0,2}\d{3,4}[-.\s]{0,2}\d{4}/;
  var corpRe=/(주식회사|㈜|\(주\)|Co\.|Corp|Ltd|Inc|그룹|금융|은행|증권|보험|캐피탈|페이|생명)/i;
  var titleRe=/(대표|사장|부사장|전무|상무|이사|부장|차장|과장|대리|사원|주임|매니저|팀장|파트장|부부장|센터장|실장|본부장|수석|책임|선임|Principal|Director|Manager|VP|CEO|CTO|CFO|COO|Head|Lead|Senior|Associate|Partner)/i;
  var teamRe=/(팀|부문|본부|부서|실|센터|국|과|Division|Department|Team|Group|Unit)/;
  for(var i=0;i<lines.length;i++){var m;if(!r.email&&(m=lines[i].match(emailRe)))r.email=m[0];
    if(!r.phone&&(m=lines[i].match(phoneRe)))r.phone=m[0].replace(/[.\s)(]/g,function(c){return c==='.'||c===' '?'-':''});
    if(!r.company&&corpRe.test(lines[i]))r.company=lines[i].replace(/[\|｜]/g,'').trim();
    if(!r.title&&(m=lines[i].match(titleRe)))r.title=lines[i].trim();
    if(!r.team&&teamRe.test(lines[i])&&lines[i]!==r.title&&lines[i]!==r.company)r.team=lines[i].replace(/[\|｜]/g,'').trim()}
  var used=[r.company,r.title,r.team,r.phone,r.email].join(' ');
  var skip=/(주식|회사|금융|서비스|보험|증권|은행|그룹|센터|경영|전략|기업|투자|운영|사업|개발|영업|지원|마케팅|미래)/;
  for(var i=0;i<lines.length&&!r.name;i++){if(lines[i]===r.company||lines[i]===r.team||emailRe.test(lines[i])||phoneRe.test(lines[i]))continue;
    var ns=lines[i].match(/[가-힣]{2,4}/g);if(ns)for(var j=0;j<ns.length;j++){if(ns[j].length>=2&&ns[j].length<=4&&used.indexOf(ns[j])<0&&!skip.test(ns[j])){r.name=ns[j];break}}}
  if(r.title&&r.name&&r.title.indexOf(r.name)>=0)r.title=r.title.replace(r.name,'').trim();
  if(r.title){var m=r.title.match(titleRe);if(m&&r.title.length>m[0].length+5)r.title=m[0]}return r}
function fillForm(p){['Co','Nm','Ti','Tm','Ph','Em'].forEach(function(k,i){var keys=['company','name','title','team','phone','email'];
  if(p[keys[i]])document.getElementById('f'+k).value=p[keys[i]]});toast('명함 인식 완료 - 내용을 확인해주세요','ok')}
